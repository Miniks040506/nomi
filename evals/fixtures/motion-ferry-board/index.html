<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skerry Ferry — departures</title>
<style>
:root{--ink:#0b1f2a;--paper:#fff;--signal:#ffd400;--settle:240ms;--curve:cubic-bezier(0.2,0.8,0.2,1)}
*{box-sizing:border-box}
body{margin:0;padding:24px;font:18px/1.4 Arial,sans-serif;color:var(--ink);background:var(--paper)}
header{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-size:28px;margin:0;flex:1}
#live{width:14px;height:14px;border-radius:50%;background:var(--signal);border:2px solid var(--ink);animation:pulse 1600ms ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.board{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:90px 1fr 110px;gap:12px;padding:14px 0;border-bottom:2px solid var(--ink);animation:settle var(--settle) var(--curve) both}
.row:nth-child(2){animation-delay:40ms}.row:nth-child(3){animation-delay:80ms}.row:nth-child(4){animation-delay:120ms}.row:nth-child(5){animation-delay:160ms}
@keyframes settle{from{opacity:0;transform:translateY(-12px)}}
.time{font-weight:700;font-variant-numeric:tabular-nums}
.state{text-align:right}
.late{background:var(--signal);padding:0 6px}
.load{margin:20px 0 8px}
.track{height:14px;border:2px solid var(--ink)}
#delay{height:100%;background:var(--ink);animation:fill 600ms ease-out both}
@keyframes fill{from{width:0}to{width:62%}}
button{font:inherit;font-weight:700;margin-top:20px;padding:12px 18px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<header><h1>Skerry Ferry</h1><span id="live" title="Board is live"></span><span>Live</span></header>
<ul class="board">
  <li class="row"><span class="time">06:40</span><span>Skerry → Holm Quay</span><span class="state">Boarding</span></li>
  <li class="row"><span class="time">07:15</span><span>Skerry → Ness Pier</span><span class="state"><span class="late">12 min late</span></span></li>
  <li class="row"><span class="time">08:00</span><span>Skerry → Holm Quay</span><span class="state">On time</span></li>
  <li class="row"><span class="time">09:30</span><span>Skerry → Outer Light</span><span class="state">On time</span></li>
  <li class="row"><span class="time">11:05</span><span>Skerry → Ness Pier</span><span class="state">On time</span></li>
</ul>
<p class="load">Car deck on the 06:40: 62% full</p>
<div class="track"><div id="delay"></div></div>
<button id="refresh" type="button">Refresh</button>
</body>
</html>

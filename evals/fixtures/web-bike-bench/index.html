<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spoke repair bench</title>
<style>
:root{--paper:#fffdf7;--ink:#1b1b1b;--amber:#f0a830;--steel:#50565c}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 Arial,Helvetica,sans-serif}
header{padding:20px 24px;border-bottom:3px solid var(--ink);font:700 14px/1 Arial,sans-serif;letter-spacing:.2em}
main{max-width:980px;margin:0 auto;padding:24px}
h1{font:700 40px/1.1 Georgia,serif;margin:8px 0 24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{border:2px solid var(--ink);border-radius:0;padding:20px}
.card h2{font:700 20px/1.2 Georgia,serif;margin:0 0 8px}
.pill{display:inline-block;padding:4px 10px;font:700 13px/1.4 Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.pill--ready{background:var(--amber);color:var(--paper)}
.ticket{display:flex;gap:12px;align-items:baseline;margin-top:12px;font-size:15px;color:var(--steel)}
.ticket code{font:700 18px/1.4 "Courier New",monospace;color:var(--ink);white-space:nowrap}
button{margin-top:16px;padding:12px 20px;border:2px solid var(--ink);border-radius:0;background:var(--ink);color:var(--paper);font:700 16px Arial,sans-serif}
</style>
</head>
<body>
<header>WHEEL / BRAKE / CHAIN</header>
<main>
<h1>Spoke repair bench</h1>
<div class="cards">
<article class="card">
<h2>Your repair</h2>
<span class="pill pill--ready" id="status">Ready for collection</span>
<p class="ticket">Ticket <code id="ref">WHL-TRUE/FRONT/2026-09-29/BAY-3</code></p>
</article>
<article class="card">
<h2>Next free slot</h2>
<p>Tuesday 09:00. Wheel truing from £25; brake bleed from £30.</p>
<button id="book" type="button">Book a repair</button>
</article>
</div>
</main>
</body>
</html>

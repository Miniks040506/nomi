<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nomi: one delivery, in evidence</title>
<style>
  :root { --jade: #1f6f5c; --leaf: #e7f2ea; --ink: #14201b; --cream: #fbf8f1; --amber: #c9781c; --line: #d5dccf; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.5 'Segoe UI', system-ui, sans-serif; background: var(--cream); color: var(--ink); }
  header, nav, main { max-width: 1040px; margin-inline: auto; }
  header { padding: 30px 40px 18px; }
  h1 { margin: 0; font-size: 34px; letter-spacing: -0.5px; }
  header p { margin: 4px 0 0; color: #45534c; }
  nav { display: flex; gap: 8px; padding: 0 40px; border-bottom: 2px solid var(--line); }
  nav button { font: inherit; font-weight: 600; padding: 12px 20px; border: 0; background: none; color: #45534c; border-bottom: 4px solid transparent; margin-bottom: -2px; cursor: pointer; }
  nav button[aria-selected=true] { color: var(--jade); border-bottom-color: var(--jade); }
  nav button:focus-visible { outline: 3px solid var(--amber); outline-offset: -3px; }
  main { padding: 26px 40px 60px; display: grid; grid-template-columns: 340px 1fr; gap: 30px; align-items: start; }
  h2 { margin: 0 0 8px; font-size: 26px; }
  .fact { display: inline-block; margin: 10px 0; padding: 8px 14px; background: var(--leaf); color: var(--jade); font-weight: 700; border-radius: 8px; }
  ol { padding-left: 20px; margin: 10px 0; }
  li { margin: 6px 0; }
  code { font: 14px/1.4 Consolas, ui-monospace, monospace; background: #efece3; padding: 2px 6px; border-radius: 4px; }
  figure { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  figure img { display: block; width: 100%; }
  figcaption { padding: 8px 14px; font-size: 14px; color: #45534c; border-top: 1px solid var(--line); }
  pre { margin: 0; padding: 18px; font: 14px/1.55 Consolas, ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<header><h1>One delivery, in evidence</h1><p>What Nomi left in the project after an agent delivered Steep, a small tea timer. Every picture and number on this page is a file from that run.</p></header>
<nav role="tablist"><button role="tab" aria-selected="true" data-tab="Plan">Plan</button><button role="tab" aria-selected="false" data-tab="Measure">Measure</button><button role="tab" aria-selected="false" data-tab="Review">Review</button><button role="tab" aria-selected="false" data-tab="Present">Present</button></nav>
<main>
  <section id="text"></section>
  <figure id="shown"></figure>
</main>
<script>
const TABS = {
  Plan: { title: 'The jobs, written as steps', fact: '3 jobs a script can run', body: '<ol><li>Steep an oolong and pour it</li><li>Save the brew with a tasting note</li><li>Nothing to save before a tea is poured</li></ol><p>Each ends in what the screen must show when the job is done.</p>', figure: '<pre>Steep an oolong and pour it\n  1. click Oolong\n  2. expect "Oolong is ready to steep"\n  3. click Start steeping\n  4. expect "Steeping Oolong"\n  5. wait \n  6. click Pour now\n  7. expect "Oolong poured after"</pre><figcaption>.nomi/flows.json, first job</figcaption>' },
  Measure: { title: 'The jobs, run in a real browser', fact: '3 of 3 flows completed', body: '<p>It clicks, types and checks the end state. A job that stops is reported with the step it stopped at; a click that changes nothing is reported too.</p><p><code>nomi observe index.html --flow</code></p>', figure: '<img src="flow.png" alt="A sheet with the page after every step of the first flow"><figcaption>The page after every step of the first job</figcaption>' },
  Review: { title: 'A verdict it can back', fact: 'nothing measured blocks SHIP', body: '<p>One command captures the page again, runs the jobs and lists what blocks shipping. SHIP is not available over a failed job or over evidence older than the last edit.</p><p><code>nomi review index.html</code></p>', figure: '<img src="proof.png" alt="The proof card: the interface, the flows"><figcaption>.nomi/proof.png, the proof card</figcaption>' },
  Present: { title: 'A demo filmed from those jobs', fact: 'Check: passed, 22 seconds', body: '<p>The video replays the jobs that passed, in the product\'s own type and colours. A job that fails while it is filmed is left out.</p><p><code>nomi brandvid index.html</code></p>', figure: '<img src="steep-poster.png" alt="The poster of the demo video of Steep"><figcaption>.nomi/video/poster.png, 2 of 2 flows shown</figcaption>' },
};
function show(name) {
  const t = TABS[name];
  for (const b of document.querySelectorAll('nav button')) b.setAttribute('aria-selected', String(b.dataset.tab === name));
  document.getElementById('text').innerHTML = '<h2>' + t.title + '</h2><div class="fact">' + t.fact + '</div>' + t.body;
  document.getElementById('shown').innerHTML = t.figure;
}
for (const b of document.querySelectorAll('nav button')) b.onclick = () => show(b.dataset.tab);
show('Plan');
</script>
</body>
</html>
